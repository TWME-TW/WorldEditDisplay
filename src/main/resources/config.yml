# WorldEditDisplay Configuration File
# Renderer Settings

# Share Settings
share:
  # How long (in seconds) a pending share invitation stays valid before it expires
  request_timeout: 30
  # How many items to show per page in share list / view list
  list_page_size: 8
  # How often (in minutes) active shares are auto-saved to disk
  auto_save_interval: 5

# Viewall Distance-Based Loading Settings
viewall:
  distance-based-loading:
    enabled: true                       # Whether to apply distance-based loading in viewall mode
    min-distance: 256                   # Minimum load distance in blocks
    size-multiplier: 1.5                # Selection diameter multiplier for dynamic load distance

# Language Settings
language:
  default: "en_us"                      # Default language (zh_tw, en_us, zh_cn)
  auto_detect: true                     # Auto detect player's client language
  allow_player_change: true             # Allow players to change their language manually

# Player Settings Limits - Admins can control the range of customization available to players
player_limits:
  # Thickness related settings range
  thickness:
    min: 0.005                          # Minimum thickness value
    max: 0.7                            # Maximum thickness value
  
  # Marker size related settings range
  marker_size:
    min: 0.1                            # Minimum marker size
    max: 2.0                            # Maximum marker size
  
  # Segments related settings range
  segments:
    min: 10                             # Minimum segments
    max: 40                             # Maximum segments
  
  # Grid division related settings range
  grid_division:
    min: 5                              # Minimum grid division
    max: 12                             # Maximum grid division
  
  # Grid spacing related settings range
  grid_spacing:
    min: 1                              # Minimum grid spacing (-1 for unlimited)
    max: 100                            # Maximum grid spacing
  
  # Target segment length related settings range
  target_segment_length:
    min: 0.1                            # Minimum segment length
    max: 1000.0                         # Maximum segment length
  
  # Scale factor related settings range
  scale_factor:
    min: 0.5                            # Minimum scale factor
    max: 10.0                           # Maximum scale factor
  
  # Fill generators related settings range (for ellipsoid fill face count)
  fill_generators:
    min: 3                              # Minimum fill generators (face count = n*(n-1))
    max: 50                             # Maximum fill generators
  
  # See through related settings range (per-shape transparency through blocks)
  see_through: true                    # Whether players can toggle see_through for individual shapes

# Renderer Settings
# Color format: #RRGGBBAA (hex, AA = alpha/opacity, 00=transparent, FF=opaque)
renderer:
  # Cuboid (Rectangular Box) Renderer Settings
  cuboid:
    # View Settings
    see_through: true                   # Whether cuboid shapes are visible through blocks
    
    # Color Settings
    edge_color: "#CC3333CC"             # Edge line color
    point1_color: "#33CC33CC"           # First selection point marker color
    point2_color: "#3333CCCC"           # Second selection point marker color
    grid_color: "#CC4C4CCC"             # Grid line color
    
    # Fill Settings
    fill_enabled: false                 # Whether to render fill faces
    fill_color: "#FF000020"             # Fill face color (semi-transparent)
    
    # Thickness Settings
    edge_thickness: 0.03                # Edge line thickness
    grid_thickness: 0.01                # Grid line thickness
    vertex_marker_size: 1.0             # Vertex marker size
    
    # Grid Density Settings
    height_grid_division: 10            # Height grid division (height / this value = grid step)
    max_grid_spacing: -1                # Maximum grid spacing (-1 for unlimited)
  
  # Cylinder Renderer Settings
  cylinder:
    # View Settings
    see_through: true                   # Whether cylinder shapes are visible through blocks
    
    # Color Settings
    circle_color: "#CC4C4CCC"           # Circle ring color
    grid_color: "#CC3333CC"             # Grid line color
    center_color: "#CC33CCCC"           # Center marker color
    center_line_color: "#CC3333CC"      # Center line color
    
    # Fill Settings (uses parallelograms to approximate the curved surface)
    fill_enabled: false                 # Whether to render fill parallelograms
    fill_color: "#CC4C4C40"             # Fill color (semi-transparent)
    
    # Thickness Settings
    circle_thickness: 0.03              # Circle ring thickness
    grid_thickness: 0.03                # Grid line thickness
    center_line_thickness: 0.04         # Center line thickness
    center_thickness: 0.05              # Center marker cube thickness
    
    # Circle Segments Settings
    min_circle_segments: 15             # Minimum segments
    max_circle_segments: 30             # Maximum segments
    target_segment_length: 0.5          # Target arc length per segment (block units)
    sqrt_scale_factor: 4.0              # Square root scale factor
    
    # Grid Density Settings
    height_grid_division: 10            # Height grid division
    radius_grid_division: 5             # Radius grid division
    max_grid_spacing: -1                # Maximum grid spacing
  
  # Ellipsoid Renderer Settings
  ellipsoid:
    # View Settings
    see_through: true                   # Whether ellipsoid shapes are visible through blocks
    
    # Color Settings
    line_color: "#CC4C4CCC"             # Line color
    center_line_color: "#CC3333CC"      # Center line color
    center_color: "#CCCC33CC"           # Center marker color
    
    # Fill Settings (uses zonohedron / rhombic polyhedron to approximate the ellipsoid surface)
    fill_enabled: false                 # Whether to render fill parallelograms
    fill_color: "#CC4C4C40"             # Fill color (semi-transparent)
    fill_generators: 15                 # Number of generator vectors (n). Face count = n*(n-1). Higher = smoother but more entities.
    
    # Thickness Settings
    line_thickness: 0.04                # Line thickness
    center_line_thickness: 0.05         # Center line thickness
    center_marker_size: 1.0             # Center marker size
    center_thickness: 0.05              # Center marker cube thickness
    
    # Ellipse Segments Settings
    min_segments: 15                    # Minimum segments
    max_segments: 30                    # Maximum segments
    target_segment_length: 0.5          # Target arc length per segment (block units)
    sqrt_scale_factor: 4.0              # Square root scale factor
    
    # Grid Density Settings
    radius_grid_division: 6             # Approximate number of grid lines per axis plane (higher = more lines)
    max_grid_spacing: -1                # Maximum grid spacing
  
  # Polygon Renderer Settings
  polygon:
    # View Settings
    see_through: true                   # Whether polygon shapes are visible through blocks
    
    # Color Settings
    edge_color: "#CC4C4CCC"             # Edge color
    vertex_color: "#33CCCCCC"           # Vertex color
    vertical_color: "#CC4C4CCC"         # Vertical line color
    
    # Fill Settings
    fill_enabled: false                 # Whether to render fill faces
    fill_color: "#CC4C4C20"             # Fill face color (semi-transparent)
    
    # Thickness Settings
    edge_thickness: 0.04                # Edge thickness
    vertical_thickness: 0.04            # Vertical line thickness
    
    # Grid Density Settings
    height_grid_division: 10            # Height grid division
    max_grid_spacing: -1                # Maximum grid spacing
  
  # Polyhedron Renderer Settings
  polyhedron:
    # View Settings
    see_through: true                   # Whether polyhedron shapes are visible through blocks
    
    # Color Settings
    line_color: "#CC3333CC"             # Edge line color
    vertex0_color: "#33CC33CC"          # First vertex color
    vertex_color: "#33CCCCCC"           # Other vertex color
    
    # Fill Settings
    fill_enabled: false                 # Whether to render fill faces
    fill_color: "#CC333320"             # Fill face color (semi-transparent)
    
    # Thickness Settings
    line_thickness: 0.03                # Line thickness
    vertex_size: 1.0                    # Vertex marker size
    vertex_thickness: 0.03              # Vertex marker cube thickness

