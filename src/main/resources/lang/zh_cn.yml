# WorldEditDisplay 简体中文语言文件
# Language: 简体中文
# Code: zh_cn

# 通用消息
general:
  prefix: "<gold>[WorldEditDisplay]</gold>"
  no_permission: "<red>你没有权限使用此命令！"
  player_only: "<red>此命令只能由玩家执行！"
  reload_success: "<green>[WorldEditDisplay] 配置重新加载成功！"
  reload_failed: "<red>[WorldEditDisplay] 配置重新加载失败！请查看控制台了解详情。"

# 玩家设置命令
command:
  wedisplay:
    set:
      usage: "<red>用法: /wedisplay set <renderer> <setting> <value>"
      example: "<red>示例: /wedisplay set cuboid edge_color #FF0000FF"
      invalid_renderer: "<red>无效的渲染器类型！"
      available_renderers: "<red>可用的渲染器: cuboid, cylinder, ellipsoid, polygon, polyhedron"
      invalid_value: "<red>无效的设置值！"
      success: "<green>已设置 %s.%s = %s"
      success_hint: "<gray>选区会在下次更新时应用新设置"
      failed: "<red>设置失败！"
      failed_hint: "<red>可能原因：数值超过服务器允许的上限"
    
    reset:
      usage: "<red>用法: /wedisplay reset <renderer> [setting]"
      example1: "<red>示例: /wedisplay reset cuboid edge_color"
      example2: "<red>示例: /wedisplay reset cuboid (重置整个渲染器)"
      invalid_renderer: "<red>无效的渲染器类型！"
      success_setting: "<green>已重置 %s.%s 为服务器默认值"
      success_all: "<green>已重置 %s 的所有设置为服务器默认值"
    
    show:
      invalid_renderer: "<red>无效的渲染器类型！"
      title: "<yellow>========== 你的个人渲染设置 =========="
      hint: "<gray>使用 <white>/wedisplay show <renderer> <gray>查看详细设置"
      available: "<gold>可用的渲染器:"
      cuboid: "<white>- cuboid <gray>(长方体) <click:run_command:'/wedisplay show cuboid'><dark_gray>[查看]</dark_gray></click>"
      cylinder: "<white>- cylinder <gray>(圆柱体) <click:run_command:'/wedisplay show cylinder'><dark_gray>[查看]</dark_gray></click>"
      ellipsoid: "<white>- ellipsoid <gray>(椭球体) <click:run_command:'/wedisplay show ellipsoid'><dark_gray>[查看]</dark_gray></click>"
      polygon: "<white>- polygon <gray>(多边形) <click:run_command:'/wedisplay show polygon'><dark_gray>[查看]</dark_gray></click>"
      polyhedron: "<white>- polyhedron <gray>(多面体) <click:run_command:'/wedisplay show polyhedron'><dark_gray>[查看]</dark_gray></click>"
      renderer_title: "<yellow>========== %s 渲染设置 =========="
      modify_hint: "<gray>使用 <white>/wedisplay set <renderer> <setting> <value> <gray>修改设置"
    
    reload:
      success: "<green>已重新加载你的个人设置！"
    
    lang:
      usage: "<red>用法: /wedisplay lang <language>"
      example: "<red>示例: /wedisplay lang zh_cn"
      disabled: "<red>服务器管理员已停用此功能！"
      success: "<green>语言已切换为: %s"
      invalid: "<red>不支持的语言！可用语言: %s"
      current: "<gold>当前语言: <white>%s"
    
    toggle:
      enabled: "<green>已开启 WorldEdit 选区渲染！"
      disabled: "<yellow>已关闭 WorldEdit 选区渲染！"
    
    debug:
      enabled: "<green>已开启调试模式！每次渲染时将显示实体数量。"
      disabled: "<yellow>已关闭调试模式！"
      entity_count: "<gray>[调试] 当前显示实体数量: <white>%d"
      cui_message: "<gray>[调试] 收到 WECUI 消息: <white>%s"
    
    help:
      title: "<yellow>========== WorldEditDisplay 个人设置 =========="
      set: "<gold>/wedisplay set <renderer> <setting> <value>"
      set_desc: "<gray>  设置个人参数"
      reset: "<gold>/wedisplay reset <renderer> [setting]"
      reset_desc: "<gray>  重置为服务器默认"
      show: "<gold>/wedisplay show [renderer]"
      show_desc: "<gray>  显示当前设置"
      reload: "<gold>/wedisplay reloadplayer"
      reload_desc: "<gray>  重载个人设置"
      lang: "<gold>/wedisplay lang [language]"
      lang_desc: "<gray>  设置语言"
      toggle: "<gold>/wedisplay toggle"
      toggle_desc: "<gray>  切换渲染开关"
      debug: "<gold>/wedisplay debug"
      debug_desc: "<gray>  切换调试模式（显示实体数量）"
      share: "<gold>/wedisplay share [invite|accept|revoke|unwatch|list]"
      share_desc: "<gray>  与其他玩家共享你的选区"
      view: "<gold>/wedisplay view [hide|hideall|unhide|label|list]"
      view_desc: "<gray>  切换全观模式并管理监控"

    share:
      player_not_found: "<red>找不到玩家「%s」或玩家不在线！"
      cannot_share_self: "<red>你不能把选区共享给自己！"
      already_shared: "<yellow>你已经在和 %s 共享选区了。"
      already_pending: "<yellow>你已经向 %s 发送了待处理的邀请。（%d 秒后过期）"
      invite_sent: "<green>已向 %s 发送共享邀请。"
      invite_received: "<aqua>[WorldEditDisplay] <white>%s <aqua>想把他们的选区共享给你！<click:run_command:'/wedisplay share accept %s'><green>[接受]</green></click>"
      invite_expired_sharer: "<yellow>你发给 %s 的邀请已过期。"
      invite_expired_target: "<yellow>来自 %s 的邀请已过期。"
      no_pending: "<yellow>你目前没有待处理的共享邀请。"
      pending_list_title: "<yellow>待处理的共享邀请："
      pending_entry: "<white>- %s <click:run_command:'/wedisplay share accept %s'><green>[接受]</green></click>"
      no_invite_from: "<red>没有来自 %s 的待处理邀请。"
      accept_success: "<green>你现在正在查看 %s 的选区。"
      viewer_accepted: "<green>%s 现在正在查看你的选区。"
      invite_usage: "<red>用法：/wedisplay share invite <玩家>"
      revoke_usage: "<red>用法：/wedisplay share revoke <玩家>"
      not_sharing_with: "<red>你没有和 %s 共享选区。"
      revoked: "<yellow>已撤销与 %s 的共享。"
      share_revoked_target: "<yellow>%s 已撤销你对其选区的访问权限。"
      unwatch_usage: "<red>用法：/wedisplay share unwatch <玩家>"
      not_viewing: "<red>你目前没有在查看 %s 的选区。"
      unwatch_success: "<yellow>已停止查看 %s 的选区。"
      list_title: "<yellow>========== 选区共享状态 =========="
      list_page_header: "<gray>第 %d 页 / 共 %d 页"
      list_empty: "<gray>目前没有共享关系。"
      list_pending_sent: "<gold>已发送的待处理邀请：<white>%s"
      list_viewers: "<gold>正在查看你选区的玩家：<white>%s"
      list_viewing: "<gold>你正在查看的选区：<white>%s"
      list_pending_received: "<gold>收到的待处理邀请：<white>%s <gray>（使用 /wedisplay share accept <玩家> 接受）"

    view:
      enabled: "<green>全观模式已启用！"
      disabled: "<yellow>全观模式已关闭！"
      hide_usage: "<red>用法：/wedisplay view hide <玩家>"
      hide_self: "<red>你不能隐藏自己。"
      hide_success: "<yellow>%s 已从全观中排除。"
      hideall_success: "<yellow>本次登录已排除所有在线玩家。"
      unhide_usage: "<red>用法：/wedisplay view unhide <玩家>"
      unhide_success: "<yellow>%s 已恢复显示于全观中。"
      label_enabled: "<green>名称标签显示已启用！"
      label_disabled: "<yellow>名称标签显示已关闭！"
      list_title: "<yellow>========== 全观状态 [%s] =========="
      list_page_header: "<gray>第 %d 页 / 共 %d 页"
      list_empty: "<gray>目前没有在线玩家。"

