# WorldEditDisplay 繁體中文語言檔
# Language: 繁體中文 (台灣)
# Code: zh_tw

# 通用訊息
general:
  prefix: "<gold>[WorldEditDisplay]</gold>"
  no_permission: "<red>你沒有權限使用此命令！"
  player_only: "<red>此命令只能由玩家執行！"
  reload_success: "<green>[WorldEditDisplay] 配置重新載入成功！"
  reload_failed: "<red>[WorldEditDisplay] 配置重新載入失敗！請查看控制台了解詳情。"

# 玩家設定命令
command:
  wedisplay:
    set:
      usage: "<red>用法: /wedisplay set <renderer> <setting> <value>"
      example: "<red>範例: /wedisplay set cuboid edge_color #FF0000FF"
      invalid_renderer: "<red>無效的渲染器類型！"
      available_renderers: "<red>可用的渲染器: cuboid, cylinder, ellipsoid, polygon, polyhedron"
      invalid_value: "<red>無效的設定值！"
      success: "<green>已設定 %s.%s = %s"
      success_hint: "<gray>選區會在下次更新時套用新設定"
      failed: "<red>設定失敗！"
      failed_hint: "<red>可能原因：數值超過伺服器允許的上限"
    
    reset:
      usage: "<red>用法: /wedisplay reset <renderer> [setting]"
      example1: "<red>範例: /wedisplay reset cuboid edge_color"
      example2: "<red>範例: /wedisplay reset cuboid (重置整個渲染器)"
      invalid_renderer: "<red>無效的渲染器類型！"
      success_setting: "<green>已重置 %s.%s 為伺服器預設值"
      success_all: "<green>已重置 %s 的所有設定為伺服器預設值"
    
    show:
      invalid_renderer: "<red>無效的渲染器類型！"
      title: "<yellow>========== 你的個人渲染設定 =========="
      hint: "<gray>使用 <white>/wedisplay show <renderer> <gray>查看詳細設定"
      available: "<gold>可用的渲染器:"
      cuboid: "<white>- cuboid <gray>(長方體) <click:run_command:'/wedisplay show cuboid'><dark_gray>[檢視]</dark_gray></click>"
      cylinder: "<white>- cylinder <gray>(圓柱體) <click:run_command:'/wedisplay show cylinder'><dark_gray>[檢視]</dark_gray></click>"
      ellipsoid: "<white>- ellipsoid <gray>(橢球體) <click:run_command:'/wedisplay show ellipsoid'><dark_gray>[檢視]</dark_gray></click>"
      polygon: "<white>- polygon <gray>(多邊形) <click:run_command:'/wedisplay show polygon'><dark_gray>[檢視]</dark_gray></click>"
      polyhedron: "<white>- polyhedron <gray>(多面體) <click:run_command:'/wedisplay show polyhedron'><dark_gray>[檢視]</dark_gray></click>"
      renderer_title: "<yellow>========== %s 渲染設定 =========="
      modify_hint: "<gray>使用 <white>/wedisplay set <renderer> <setting> <value> <gray>修改設定"
    
    reload:
      success: "<green>已重新載入你的個人設定！"
    
    lang:
      usage: "<red>用法: /wedisplay lang <language>"
      example: "<red>範例: /wedisplay lang zh_tw"
      disabled: "<red>伺服器管理員已停用此功能！"
      success: "<green>語言已切換為: %s"
      invalid: "<red>不支援的語言！可用語言: %s"
      current: "<gold>目前語言: <white>%s"
    
    toggle:
      enabled: "<green>已開啟 WorldEdit 選區渲染！"
      disabled: "<yellow>已關閉 WorldEdit 選區渲染！"
    
    debug:
      enabled: "<green>已開啟除錯模式！每次渲染時將顯示實體數量。"
      disabled: "<yellow>已關閉除錯模式！"
      entity_count: "<gray>[除錯] 目前顯示實體數量: <white>%d"
      cui_message: "<gray>[除錯] 收到 WECUI 訊息: <white>%s"
    
    help:
      title: "<yellow>========== WorldEditDisplay 個人設定 =========="
      set: "<gold>/wedisplay set <renderer> <setting> <value>"
      set_desc: "<gray>  設定個人參數"
      reset: "<gold>/wedisplay reset <renderer> [setting]"
      reset_desc: "<gray>  重置為伺服器預設"
      show: "<gold>/wedisplay show [renderer]"
      show_desc: "<gray>  顯示當前設定"
      reload: "<gold>/wedisplay reloadplayer"
      reload_desc: "<gray>  重載個人設定"
      lang: "<gold>/wedisplay lang [language]"
      lang_desc: "<gray>  設定語言"
      toggle: "<gold>/wedisplay toggle"
      toggle_desc: "<gray>  切換渲染開關"
      debug: "<gold>/wedisplay debug"
      debug_desc: "<gray>  切換除錯模式（顯示實體數量）"
      share: "<gold>/wedisplay share [玩家|accept|remove|stop|list]"
      share_desc: "<gray>  與其他玩家分享你的選區"

    share:
      player_not_found: "<red>找不到玩家「%s」或玩家不在線！"
      cannot_share_self: "<red>你不能把選區分享給自己！"
      already_shared: "<yellow>你已經在和 %s 分享選區了。"
      already_pending: "<yellow>你已經向 %s 發送了等待中的邀請。"
      invite_sent: "<green>已向 %s 發送分享邀請。"
      invite_received: "<aqua>[WorldEditDisplay] <white>%s <aqua>想把他們的選區分享給你！<click:run_command:'/wedisplay share accept %s'><green>[接受]</green></click>"
      no_pending: "<yellow>你目前沒有等待中的分享邀請。"
      pending_list_title: "<yellow>等待中的分享邀請："
      pending_entry: "<white>- %s <click:run_command:'/wedisplay share accept %s'><green>[接受]</green></click>"
      no_invite_from: "<red>沒有來自 %s 的等待中邀請。"
      accept_success: "<green>你現在正在觀看 %s 的選區。"
      viewer_accepted: "<green>%s 現在正在觀看你的選區。"
      remove_usage: "<red>用法：/wedisplay share remove <玩家>"
      not_sharing_with: "<red>你沒有和 %s 分享選區。"
      removed: "<yellow>已停止與 %s 分享選區。"
      share_revoked: "<yellow>%s 已停止與你分享他們的選區。"
      stop_usage: "<red>用法：/wedisplay share stop <玩家>"
      not_viewing: "<red>你目前沒有在觀看 %s 的選區。"
      stopped_viewing: "<yellow>已停止觀看 %s 的選區。"
      viewer_stopped: "<yellow>%s 已停止觀看你的選區。"
      list_title: "<yellow>========== 選區分享狀態 =========="
      list_pending_sent: "<gold>已發送的等待邀請：<white>%s"
      list_viewers: "<gold>正在觀看你選區的玩家：<white>%s"
      list_viewing: "<gold>你正在觀看的選區：<white>%s"
      list_pending_received: "<gold>收到的等待邀請：<white>%s <gray>（使用 /wedisplay share accept <玩家> 接受）"

