# WorldEditDisplay English Language File
# Language: English (United States)
# Code: en_us

# General Messages
general:
  prefix: "<gold>[WorldEditDisplay]</gold>"
  no_permission: "<red>You don't have permission to use this command!"
  player_only: "<red>This command can only be executed by players!"
  reload_success: "<green>[WorldEditDisplay] Configuration reloaded successfully!"
  reload_failed: "<red>[WorldEditDisplay] Configuration reload failed! Check console for details."

# Player Settings Commands
command:
  wedisplay:
    set:
      usage: "<red>Usage: /wedisplay set <renderer> <setting> <value>"
      example: "<red>Example: /wedisplay set cuboid edge_color #FF0000FF"
      invalid_renderer: "<red>Invalid renderer type!"
      available_renderers: "<red>Available renderers: cuboid, cylinder, ellipsoid, polygon, polyhedron"
      invalid_value: "<red>Invalid setting value!"
      success: "<green>Set %s.%s = %s"
      success_hint: "<gray>Selection will be updated on next refresh"
      failed: "<red>Setting failed!"
      failed_hint: "<red>Possible reason: Value exceeds server limit"
    
    reset:
      usage: "<red>Usage: /wedisplay reset <renderer> [setting]"
      example1: "<red>Example: /wedisplay reset cuboid edge_color"
      example2: "<red>Example: /wedisplay reset cuboid (reset entire renderer)"
      invalid_renderer: "<red>Invalid renderer type!"
      success_setting: "<green>Reset %s.%s to server default"
      success_all: "<green>Reset all settings for %s to server default"
    
    show:
      invalid_renderer: "<red>Invalid renderer type!"
      title: "<yellow>========== Your Personal Render Settings =========="
      hint: "<gray>Use <white>/wedisplay show <renderer> <gray>to view detailed settings"
      available: "<gold>Available renderers:"
      cuboid: "<white>- cuboid <gray>(Cuboid) <click:run_command:'/wedisplay show cuboid'><dark_gray>[SHOW]</dark_gray></click>"
      cylinder: "<white>- cylinder <gray>(Cylinder) <click:run_command:'/wedisplay show cylinder'><dark_gray>[SHOW]</dark_gray></click>"
      ellipsoid: "<white>- ellipsoid <gray>(Ellipsoid) <click:run_command:'/wedisplay show ellipsoid'><dark_gray>[SHOW]</dark_gray></click>"
      polygon: "<white>- polygon <gray>(Polygon) <click:run_command:'/wedisplay show polygon'><dark_gray>[SHOW]</dark_gray></click>"
      polyhedron: "<white>- polyhedron <gray>(Polyhedron) <click:run_command:'/wedisplay show polyhedron'><dark_gray>[SHOW]</dark_gray></click>"
      renderer_title: "<yellow>========== %s Render Settings =========="
      modify_hint: "<gray>Use <white>/wedisplay set <renderer> <setting> <value> <gray>to modify settings"
    
    reload:
      success: "<green>Personal settings reloaded!"
    
    lang:
      usage: "<red>Usage: /wedisplay lang <language>"
      example: "<red>Example: /wedisplay lang en_us"
      disabled: "<red>This feature has been disabled by server administrator!"
      success: "<green>Language changed to: %s"
      invalid: "<red>Unsupported language! Available: %s"
      current: "<gold>Current language: <white>%s"
    
    toggle:
      enabled: "<green>WorldEdit selection rendering enabled!"
      disabled: "<yellow>WorldEdit selection rendering disabled!"
    
    debug:
      enabled: "<green>Debug mode enabled! Entity count will be shown on each render."
      disabled: "<yellow>Debug mode disabled!"
      entity_count: "<gray>[Debug] Current display entity count: <white>%d"
      cui_message: "<gray>[Debug] Received WECUI message: <white>%s"
    
    help:
      title: "<yellow>========== WorldEditDisplay Personal Settings =========="
      set: "<gold>/wedisplay set <renderer> <setting> <value>"
      set_desc: "<gray>  Set personal parameter"
      reset: "<gold>/wedisplay reset <renderer> [setting]"
      reset_desc: "<gray>  Reset to server default"
      show: "<gold>/wedisplay show [renderer]"
      show_desc: "<gray>  Display current settings"
      reload: "<gold>/wedisplay reloadplayer"
      reload_desc: "<gray>  Reload personal settings"
      lang: "<gold>/wedisplay lang [language]"
      lang_desc: "<gray>  Set language"
      toggle: "<gold>/wedisplay toggle"
      toggle_desc: "<gray>  Toggle rendering on/off"
      debug: "<gold>/wedisplay debug"
      debug_desc: "<gray>  Toggle debug mode (show entity count)"
      share: "<gold>/wedisplay share [player|accept|remove|stop|list]"
      share_desc: "<gray>  Share your selection with another player"

    share:
      player_not_found: "<red>Player '%s' not found or not online!"
      cannot_share_self: "<red>You cannot share your selection with yourself!"
      already_shared: "<yellow>You are already sharing with %s."
      already_pending: "<yellow>You already have a pending invite sent to %s."
      invite_sent: "<green>Share invitation sent to %s."
      invite_received: "<aqua>[WorldEditDisplay] <white>%s <aqua>wants to share their selection with you! <click:run_command:'/wedisplay share accept %s'><green>[Accept]</green></click>"
      no_pending: "<yellow>You have no pending share invitations."
      pending_list_title: "<yellow>Pending share invitations:"
      pending_entry: "<white>- %s <click:run_command:'/wedisplay share accept %s'><green>[Accept]</green></click>"
      no_invite_from: "<red>No pending invitation from %s."
      accept_success: "<green>You are now viewing %s's selection."
      viewer_accepted: "<green>%s is now viewing your selection."
      remove_usage: "<red>Usage: /wedisplay share remove <player>"
      not_sharing_with: "<red>You are not sharing with %s."
      removed: "<yellow>Stopped sharing with %s."
      share_revoked: "<yellow>%s has stopped sharing their selection with you."
      stop_usage: "<red>Usage: /wedisplay share stop <player>"
      not_viewing: "<red>You are not viewing %s's selection."
      stopped_viewing: "<yellow>Stopped viewing %s's selection."
      viewer_stopped: "<yellow>%s has stopped viewing your selection."
      list_title: "<yellow>========== Selection Sharing Status =========="
      list_pending_sent: "<gold>Pending invitations sent: <white>%s"
      list_viewers: "<gold>Players viewing your selection: <white>%s"
      list_viewing: "<gold>Selections you are viewing: <white>%s"
      list_pending_received: "<gold>Pending invitations received: <white>%s <gray>(use /wedisplay share accept <player>)"

