# WorldEditDisplay English Language File
# Language: English (United States)
# Code: en_us

# General Messages
general:
  prefix: "<#478FC6>[WorldEditDisplay]"
  no_permission: "<#CE5F4E>You don't have permission to use this command!"
  player_only: "<#CE5F4E>This command can only be executed by players!"
  reload_success: "<green>[WorldEditDisplay] Configuration reloaded successfully!"
  reload_failed: "<#CE5F4E>[WorldEditDisplay] Configuration reload failed! Check console for details."

# Player Settings Commands
command:
  wedisplay:
    set:
      usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay set <renderer> <setting> <value>"
      example: "<#D1968C>Example: /wedisplay set cuboid edge_color #FF0000FF"
      invalid_renderer: "<#CE5F4E>Invalid renderer type!"
      available_renderers: "<#D1968C>Available renderers: <#C2C7D3>cuboid, cylinder, ellipsoid, polygon, polyhedron"
      invalid_value: "<#CE5F4E>Invalid setting value!"
      success: "<green>Set <white>%s<green>.<white>%s <green>= <white>%s"
      success_hint: "<#C2C7D3>Selection will be updated on next refresh"
      failed: "<#CE5F4E>Setting failed!"
      failed_hint: "<#D1968C>! Possible reason: value exceeds server limit"
    
    reset:
      usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay reset <renderer> [setting]"
      example1: "<#D1968C>Example: /wedisplay reset cuboid edge_color"
      example2: "<#D1968C>Example: /wedisplay reset cuboid <#C2C7D3>(resets entire renderer)"
      invalid_renderer: "<#CE5F4E>Invalid renderer type!"
      success_setting: "<green>Reset <white>%s<green>.<white>%s <green>to server default"
      success_all: "<green>Reset all settings for <white>%s <green>to server default"
    
    show:
      invalid_renderer: "<#CE5F4E>Invalid renderer type!"
      title: "<#478FC6>\u2014\u2014 <white>Your Render Settings <#478FC6>\u2014\u2014"
      hint: "<#C2C7D3>Use <white>/wedisplay show <renderer> <#C2C7D3>to view detailed settings"
      available: "<#478FC6>Available renderers:"
      cuboid: "<#C2C7D3>\u00b7 cuboid <dark_gray>(Cuboid) <click:run_command:'/wedisplay show cuboid'><#478FC6>[\u25b8 View]</click>"
      cylinder: "<#C2C7D3>\u00b7 cylinder <dark_gray>(Cylinder) <click:run_command:'/wedisplay show cylinder'><#478FC6>[\u25b8 View]</click>"
      ellipsoid: "<#C2C7D3>\u00b7 ellipsoid <dark_gray>(Ellipsoid) <click:run_command:'/wedisplay show ellipsoid'><#478FC6>[\u25b8 View]</click>"
      polygon: "<#C2C7D3>\u00b7 polygon <dark_gray>(Polygon) <click:run_command:'/wedisplay show polygon'><#478FC6>[\u25b8 View]</click>"
      polyhedron: "<#C2C7D3>\u00b7 polyhedron <dark_gray>(Polyhedron) <click:run_command:'/wedisplay show polyhedron'><#478FC6>[\u25b8 View]</click>"
      renderer_title: "<#478FC6>\u2014\u2014 <white>%s Settings <#478FC6>\u2014\u2014"
      modify_hint: "<#C2C7D3>Use <white>/wedisplay set <renderer> <setting> <value> <#C2C7D3>to modify"
    
    reload:
      success: "<green>Personal settings reloaded!"
    
    lang:
      usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay lang <language>"
      example: "<#D1968C>Example: /wedisplay lang en_us"
      disabled: "<#CE5F4E>This feature has been disabled by the server administrator!"
      success: "<green>Language changed to: <white>%s"
      invalid: "<#CE5F4E>Unsupported language! <#D1968C>Available: <#C2C7D3>%s"
      current: "<#C2C7D3>Current language: <white>%s"
    
    toggle:
      enabled: "<green>WorldEdit selection rendering enabled!"
      disabled: "<#E8C96D>WorldEdit selection rendering disabled!"
    
    debug:
      enabled: "<green>Debug mode enabled! Entity count will be shown on each render."
      disabled: "<#E8C96D>Debug mode disabled!"
      entity_count: "<#C2C7D3>[Debug] Current display entity count: <white>%d"
      retained_line_count: "<#C2C7D3>[Debug] Retained unchanged line shapes: <white>%d"
      particle_count: "<#C2C7D3>[Debug] Current particle point count: <white>%d"
      cui_message: "<#C2C7D3>[Debug] Received WECUI message: <white>%s"

    render:
      current: "<#C2C7D3>Current render mode: <white>%s"
      set: "<green>Render mode set to: <white>%s"
      usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay render <auto|text|particle|toggle>"
      mode_auto: "<#C2C7D3>Auto (detect from client version)"
      mode_text: "<green>TextDisplay"
      mode_particle: "<#E8C96D>Particle (fallback)"

    help:
      title: "<#478FC6>\u2014\u2014 <white>WorldEditDisplay Commands <#478FC6>\u2014\u2014"
      set: "<#478FC6>/wedisplay set <renderer> <setting> <value>"
      set_desc: "<#C2C7D3>  \u21b3 Customize renderer appearance (color, thickness, fill, etc.)"
      reset: "<#478FC6>/wedisplay reset <renderer> [setting]"
      reset_desc: "<#C2C7D3>  \u21b3 Revert one setting or all settings to server defaults"
      show: "<#478FC6>/wedisplay show [renderer]"
      show_desc: "<#C2C7D3>  \u21b3 Browse available renderers and view your current settings"
      reload: "<#478FC6>/wedisplay reloadplayer"
      reload_desc: "<#C2C7D3>  \u21b3 Reload your personal settings from disk"
      lang: "<#478FC6>/wedisplay lang [language]"
      lang_desc: "<#C2C7D3>  \u21b3 Switch the plugin display language (e.g. en_us, zh_tw)"
      toggle: "<#478FC6>/wedisplay toggle"
      toggle_desc: "<#C2C7D3>  \u21b3 Enable or disable the selection visualizer"
      debug: "<#478FC6>/wedisplay debug"
      debug_desc: "<#C2C7D3>  \u21b3 Toggle debug overlay (shows live entity/particle count per render)"
      render: "<#478FC6>/wedisplay render [auto|text|particle|toggle]"
      render_desc: "<#C2C7D3>  \u21b3 Switch between TextDisplay and particle fallback rendering"

    share:
      player_not_found: "<#CE5F4E>Player '<white>%s<#CE5F4E>' not found or not online!"
      cannot_share_self: "<#CE5F4E>You cannot share your selection with yourself!"
      already_shared: "<#E8C96D>You are already sharing with <white>%s<#E8C96D>."
      already_pending: "<#E8C96D>You already have a pending invite sent to <white>%s<#E8C96D>. <#C2C7D3>(expires in %ds)"
      invite_sent: "<green>Share invitation sent to <white>%s<green>."
      invite_received: "<#478FC6>[WorldEditDisplay] <white>%s <#C2C7D3>wants to share their selection with you! <click:run_command:'/wedisplay share accept %s'><green>[\u2714 Accept]</green></click>"
      invite_expired_sharer: "<#E8C96D>Your invite to <white>%s<#E8C96D> has expired."
      invite_expired_target: "<#E8C96D>The invite from <white>%s<#E8C96D> has expired."
      no_pending: "<#C2C7D3>You have no pending share invitations."
      pending_list_title: "<#478FC6>\u2014\u2014 <white>Pending Invitations <#478FC6>\u2014\u2014"
      pending_entry: "<#C2C7D3>\u00b7 <white>%s <click:run_command:'/wedisplay share accept %s'><green>[\u2714 Accept]</green></click>"
      no_invite_from: "<#CE5F4E>No pending invitation from '<white>%s<#CE5F4E>'."
      accept_success: "<green>You are now viewing <white>%s<green>'s selection."
      viewer_accepted: "<green><white>%s <green>is now viewing your selection."
      invite_usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay share invite <player>"
      revoke_usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay share revoke <player>"
      not_sharing_with: "<#CE5F4E>You are not sharing with '<white>%s<#CE5F4E>'."
      revoked: "<#E8C96D>Revoked share access for <white>%s<#E8C96D>."
      share_revoked_target: "<#E8C96D><white>%s <#E8C96D>has revoked your access to their selection."
      unwatch_usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay share unwatch <player>"
      not_viewing: "<#CE5F4E>You are not viewing '<white>%s<#CE5F4E>'s selection."
      unwatch_success: "<#E8C96D>Stopped watching <white>%s<#E8C96D>'s selection."
      list_title: "<#478FC6>\u2014\u2014 <white>Selection Sharing <#478FC6>\u2014\u2014"
      list_page_header: "<#C2C7D3>\u25c0 Page %d / %d \u25b6"
      list_empty: "<#C2C7D3>No active share relationships."
      list_pending_sent: "<#478FC6>Pending sent: <white>%s"
      list_viewers: "<#478FC6>Viewers of your selection: <white>%s"
      list_viewing: "<#478FC6>Selections you are watching: <white>%s"
      list_pending_received: "<#478FC6>Pending received: <white>%s <#C2C7D3>(use /wedisplay share accept <player>)"

    view:
      enabled: "<green>Viewall mode enabled!"
      disabled: "<#E8C96D>Viewall mode disabled!"
      hide_usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay view hide <player>"
      hide_self: "<#CE5F4E>You cannot hide yourself."
      hide_success: "<#E8C96D><white>%s <#E8C96D>is now excluded from viewall."
      hideall_success: "<#E8C96D>All online players excluded from viewall this session."
      unhide_usage: "<#CE5F4E>Usage: <#D1968C>/wedisplay view unhide <player>"
      unhide_success: "<#E8C96D><white>%s <#E8C96D>is no longer excluded from viewall."
      label_enabled: "<green>Name label display enabled!"
      label_disabled: "<#E8C96D>Name label display disabled!"
      list_title: "<#478FC6>\u2014\u2014 <white>Viewall Status <dark_gray>[%s] <#478FC6>\u2014\u2014"
      list_page_header: "<#C2C7D3>\u25c0 Page %d / %d \u25b6"
      list_empty: "<#C2C7D3>No online players."

