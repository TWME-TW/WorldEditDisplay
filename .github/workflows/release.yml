name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # The platform profiles compile against different APIs, so each needs a clean build.
      - name: Build Paper artifact
        run: |
          mvn -B clean package
          mkdir -p dist
          cp target/WorldEditDisplay-*-paper.jar dist/
      - name: Build Spigot artifact
        run: |
          mvn -B clean package -P spigot -DskipTests
          cp target/WorldEditDisplay-*-spigot.jar dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/WorldEditDisplay-*-paper.jar
          dist/WorldEditDisplay-*-spigot.jar
          --title "WorldEditDisplay ${GITHUB_REF_NAME}"
          --generate-notes
